# Cada hora: el servidor de la IA trae existencia y productos de InSitu y ajusta las fechas de caducidad.
# (Vercel en plan gratuito solo permite tareas diarias; GitHub Actions la dispara cada hora.)
name: InSitu sync (IA)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actualizar existencia y fechas
        run: |
          curl -sS --max-time 150 https://ctd-seven.vercel.app/api/insitu-cron | tee out.json
          echo
          grep -q '"ok":true' out.json
